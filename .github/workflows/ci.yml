name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (fails on high or critical advisories)
        # Safeguard check 6. Clean at the high threshold on 2026-09-14 (three
        # moderate advisories open, listed in SECURITY.md "Known gaps"), so
        # the gate blocks from the start. If it ever has to be relaxed, do it
        # with `continue-on-error: true` and a dated comment here, never by
        # lowering the level silently.
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Not `npm run build`: that script starts with `prisma migrate deploy`
        # (hosted deploys migrate on build), which needs a reachable database.
        # CI has none — build the app directly against the dummy URL.
        run: npx next build
        env:
          # Build must not depend on real secrets. A dummy DATABASE_URL keeps
          # Prisma happy; no page hits the database at build time.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          NEXT_TELEMETRY_DISABLED: "1"
