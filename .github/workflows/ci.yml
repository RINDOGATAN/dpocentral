name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (fails on high or critical advisories)
        # Safeguard check 6. Clean at the high threshold on 2026-09-14 (three
        # moderate advisories open, listed in SECURITY.md "Known gaps"), so
        # the gate blocks from the start. If it ever has to be relaxed, do it
        # with `continue-on-error: true` and a dated comment here, never by
        # lowering the level silently.
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Not `npm run build`: that script starts with `prisma migrate deploy`
        # (hosted deploys migrate on build), which needs a reachable database.
        # CI has none — build the app directly against the dummy URL.
        run: npx next build
        env:
          # Build must not depend on real secrets. A dummy DATABASE_URL keeps
          # Prisma happy; no page hits the database at build time.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          NEXT_TELEMETRY_DISABLED: "1"

  smoke:
    # A fresh self-hosted install from zero, then a pilot user's walk in a
    # real browser (e2e/smoke.spec.ts) at 1280 px and 390 px. Throwaway
    # Postgres in the job; never the hosted database.
    name: fresh install · browser smoke walk
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dpocentral
          POSTGRES_PASSWORD: dpocentral_ci
          POSTGRES_DB: dpocentral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dpocentral -d dpocentral"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dpocentral:dpocentral_ci@localhost:5432/dpocentral?schema=public
      NEXTAUTH_URL: http://localhost:3101
      NEXTAUTH_SECRET: ci-smoke-secret-not-used-anywhere-else
      # The self-hosted posture: local sign-in, baked in at build time.
      NEXT_PUBLIC_LOCAL_AUTH_ENABLED: "true"
      DEMO_SEED: "false"
      SMOKE_PORT: "3101"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply every migration, in order, to the empty database
        run: npx prisma migrate deploy

      - name: Seed (as a first boot does)
        run: |
          npm run db:seed
          npm run db:seed-templates
          npm run db:seed-questionnaire

      - name: Build
        run: npx next build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Smoke walk
        run: npx playwright test

      - name: Keep the report when the walk fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
